name: Refresh schedule and publish

on:
  push:
    branches: [main]
  schedule:
    # Mondays and Fridays, early morning Toronto time. The city refreshes its
    # feed weekly (Thursday afternoons lately); the second run catches delays.
    - cron: "17 10 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A push publishes exactly what was committed. Scheduled and manual runs
      # pull the latest schedule from the city first.
      - name: Fetch the latest schedule from the city
        if: github.event_name != 'push'
        run: python3 -I build_data.py

      - name: Save the refreshed schedule
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/schedule.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedule.json
            git commit -m "Refresh schedule from City of Toronto open data"
            git push
          fi

      - name: Build the site
        run: python3 -I build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
