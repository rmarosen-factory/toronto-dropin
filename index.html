<title>Toronto Drop-In Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a pool-party flyer. A raccoon lifeguard bobs in the masthead and
   swaps hats with the activity; each activity repaints the page in its own
   colour; chips and cards are chunky stickers in one narrow column. */
:root{
  --bg:#E2F5F4; --dot:#CBEAE9; --surface:#FFFFFF; --sunken:#D9EEF0; --ink:#16213E; --ink-2:#4B5877; --edge:#16213E; --on-act:#16213E;
  --swim:#3CCBDD; --skate:#9CC2FF; --sports:#FF9F45; --fit:#FF7493; --arts:#BB96FF; --youth:#62D694; --early:#FFD447;
  --live:#0B6B41; --live-soft:#CDF2DD; --soon:#7E4500; --soon-soft:#FFE8BD;
  --fur:#A3ABBB; --fur-dark:#3A4157; --fur-light:#F4F6FA;
  --act:var(--swim);
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1634; --dot:#182149; --surface:#1B2450; --sunken:#27336A; --ink:#F3F1FF; --ink-2:#AFB7DB; --edge:#050919;
    --live:#7BE3AD; --live-soft:#113A29; --soon:#FFC56B; --soon-soft:#3F2F0E;
    --fur:#A9B1C4; --fur-dark:#2B3149; --fur-light:#F4F6FA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1634; --dot:#182149; --surface:#1B2450; --sunken:#27336A; --ink:#F3F1FF; --ink-2:#AFB7DB; --edge:#050919;
  --live:#7BE3AD; --live-soft:#113A29; --soon:#FFC56B; --soon-soft:#3F2F0E;
  --fur:#A9B1C4; --fur-dark:#2B3149; --fur-light:#F4F6FA; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg) radial-gradient(var(--dot) 1.6px,transparent 2.2px) 0 0/22px 22px;color:var(--ink);font-family:var(--body);font-size:15.5px;font-weight:500;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
a{color:var(--ink);font-weight:800;text-decoration-line:underline;text-decoration-color:var(--act);text-decoration-thickness:3px;text-underline-offset:3px}

.page{max-width:720px;margin:0 auto;padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:20px}
.page[data-mood="1"]{--act:var(--skate)}
.page[data-mood="2"]{--act:var(--sports)}
.page[data-mood="3"]{--act:var(--fit)}
.page[data-mood="4"]{--act:var(--arts)}
.page[data-mood="5"]{--act:var(--youth)}
.page[data-mood="6"]{--act:var(--early)}

/* masthead */
.mast{display:flex;flex-direction:column}
.mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:-9px}
.mast-text{display:flex;flex-direction:column;gap:7px;min-width:0;padding-bottom:20px}
.mast h1{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.mast h1 span{white-space:nowrap;text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:var(--act);text-decoration-thickness:3px;text-underline-offset:5px}
.tag-line{margin:0;font-weight:700;font-size:16px;color:var(--ink-2);text-wrap:balance}
.tag-line mark{display:inline-block;background:var(--act);color:var(--on-act);font-family:var(--display);font-weight:700;padding:1px 8px 0;border-radius:8px;transform:rotate(-2deg)}
.mascot{flex:none;width:123px;height:auto;transform-origin:50% 90%;animation:bob 3.4s ease-in-out infinite}
.mascot .acc{display:none}
.page[data-mood="0"] .acc-0,.page[data-mood="1"] .acc-1,.page[data-mood="2"] .acc-2,.page[data-mood="3"] .acc-3,
.page[data-mood="4"] .acc-4,.page[data-mood="5"] .acc-5,.page[data-mood="6"] .acc-6{display:block}
@keyframes bob{0%,100%{transform:translateY(1px) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.waves{position:relative;z-index:1;height:16px;border-radius:0 0 8px 8px;
  background:radial-gradient(circle at 12px -1px,transparent 12px,var(--act) 12.5px) 0 0/24px 16px repeat-x}

/* starting point */
.origin{display:flex;flex-direction:column;gap:10px}
.origin-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:10px 14px;box-shadow:4px 4px 0 var(--act)}
.origin-btn .where{display:flex;flex-direction:column;min-width:0}
.origin-btn .where strong{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.origin-btn .change{flex:none;background:var(--act);color:var(--on-act);border:2px solid var(--edge);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;transform:rotate(2deg)}
.loc-panel{background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.loc-panel input[type="text"]{width:100%;padding:10px 14px;border:2px solid var(--edge);border-radius:999px;background:var(--bg);font-size:16px;font-weight:700}
.sugs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sugs button{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:none;border-radius:12px;padding:7px 12px}
.sugs button:hover{background:var(--act);color:var(--on-act)}
.sugs .s-main{font-weight:800}
.sugs .s-sub,.hint{color:var(--ink-2);font-size:13.5px}
.sugs button:hover .s-sub{color:inherit}
.hint{margin:0}
.recents{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* filters */
.filters{display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:5px 13px;font-size:14.5px;font-weight:700;line-height:1.25;transition:transform .12s ease}
.chip:hover{transform:rotate(-2deg) scale(1.04)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--act);color:var(--on-act);box-shadow:2px 2px 0 var(--edge);transform:rotate(-1.5deg)}
.chip.quiet{background:none;border-style:dashed;color:var(--ink-2)}
.cats .chip{font-family:var(--display);font-size:17px;padding:6px 14px 5px;display:inline-flex;align-items:center;gap:7px}
.cats .chip::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--edge)}
.cats .chip[aria-pressed="true"]{background:var(--c)}
.cats .chip[aria-pressed="true"]::before{background:var(--surface)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:0 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;overflow:hidden;transition:transform .12s ease}
.day small{align-self:stretch;background:var(--sunken);border-bottom:2px solid var(--edge);padding:3px 0 2px;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;text-align:center}
.day span{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1}
.day[aria-pressed="true"]{background:var(--act);color:var(--on-act);box-shadow:2px 2px 0 var(--edge);transform:rotate(-2.5deg)}
.day[aria-pressed="true"] small{background:var(--edge);color:var(--act)}
.day:disabled{opacity:.4;cursor:default}
.opts{display:flex;flex-wrap:wrap;gap:14px 22px}
.who{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:9px 14px 10px;box-shadow:4px 4px 0 var(--act)}
.who-q{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.2}
.age{width:94px;padding:5px 10px 4px;border:2px solid var(--edge);border-radius:999px;background:var(--bg);font-family:var(--display);font-size:19px;font-weight:700;text-align:center}
.age::placeholder{color:var(--ink-2);opacity:1}
.who.on .age{background:var(--act);color:var(--on-act)}
.who-hint{grid-column:1/-1;margin:0;color:var(--ink-2);font-size:13.5px}
.who-hint .link{color:var(--ink);text-decoration-color:var(--act);text-decoration-thickness:3px}

/* results */
.notice{background:var(--early);color:var(--on-act);border:2px solid var(--edge);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-weight:700;transform:rotate(-.5deg);box-shadow:3px 3px 0 var(--edge)}
.notice button,.link{background:none;border:none;padding:0;color:inherit;font-weight:800;text-decoration-line:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.summary{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;padding-top:2px}
.summary p{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25}
.summary .link{font-size:14px;text-decoration-color:var(--act);text-decoration-thickness:3px}
.summary p.hint{flex-basis:100%;font-family:var(--body);font-size:13.5px;font-weight:500;line-height:1.45}
.results{display:flex;flex-direction:column;gap:18px}
.place{background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:15px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 5px 0 var(--act)}
.place-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.place-head h3{margin:0;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.dist{flex:none;background:var(--act);color:var(--on-act);border:2px solid var(--edge);border-radius:999px;padding:2px 10px 1px;font-family:var(--display);font-size:15px;font-weight:700;transform:rotate(3deg)}
.meta{margin:-5px 0 0;color:var(--ink-2);font-size:14px}
.day-strip{display:flex;flex-direction:column;gap:3px}
.strip{position:relative;height:14px;background:var(--sunken);border:2px solid var(--edge);border-radius:999px;overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;background:var(--act);min-width:3px}
.strip i.past{opacity:.35}
.strip b{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ink)}
.ticks{position:relative;height:14px;font-size:11px;font-weight:700;color:var(--ink-2)}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.sessions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sessions li{display:grid;grid-template-columns:9.8em minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:2px dashed var(--sunken);align-items:baseline}
.sessions li.past{opacity:.5}
.time{font-family:var(--display);font-size:16px;font-weight:700;white-space:nowrap}
.what{min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.what .name{font-weight:700;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.live{background:var(--live-soft);color:var(--live)}
.tag.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:blink 1.4s ease-in-out infinite}
.tag.soon{background:var(--soon-soft);color:var(--soon)}
.tag.ages{background:var(--sunken);background:color-mix(in srgb,var(--act) 42%,var(--surface));color:var(--ink);border:1.5px solid var(--edge);font-family:var(--display);font-size:12.5px;padding:1px 9px 0}
@keyframes blink{50%{opacity:.25}}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14.5px;border-top:2px dashed var(--sunken);padding-top:10px}
.links .phone{color:var(--ink-2);user-select:all;font-weight:700}
.empty{background:var(--surface);border:2px dashed var(--edge);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.empty p{margin:0}
.empty .big{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25}
.more{align-self:center}

/* views, favourites, plan */
[hidden]{display:none!important}
.ic{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ic.solid{fill:currentColor}
.tabs{display:flex;gap:7px}
.tab{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:7px 10px 5px;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;transition:transform .12s ease}
.tab:hover{transform:rotate(-1.5deg) scale(1.03)}
.tab[aria-pressed="true"]{background:var(--act);color:var(--on-act);box-shadow:3px 3px 0 var(--edge);transform:rotate(-1.5deg)}
.count{min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--body);font-size:12px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.tab[aria-pressed="true"] .count{background:var(--on-act);color:var(--act)}
.chip.ico{display:inline-flex;align-items:center;gap:6px}
a.chip{display:inline-block;text-decoration:none}
.heart,.row-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;background:var(--surface);border:2px solid var(--edge);border-radius:50%;transition:transform .12s ease}
.heart{width:34px;height:34px;font-size:16px;margin-left:auto}
.heart:hover{transform:rotate(-8deg) scale(1.08)}
.heart[aria-pressed="true"]{background:var(--fit);color:var(--on-act);box-shadow:2px 2px 0 var(--edge)}
.place-head h3{flex:1 1 auto}
.place-head h3 small{display:block;font-family:var(--body);font-size:14px;font-weight:700;color:var(--ink-2);margin-top:2px}
.row-btn{width:32px;height:32px;font-size:15px;align-self:center}
.row-btn.on{background:var(--act);color:var(--on-act)}
.row-btn[aria-expanded="true"]{box-shadow:2px 2px 0 var(--edge)}
.row-btn[aria-expanded="true"]:not(.on){transform:rotate(45deg)}
.what .name .ic{width:.85em;height:.85em;margin-left:5px;vertical-align:-.05em;color:var(--fit);stroke:var(--edge);stroke-width:2.2}
.what .at{flex-basis:100%;color:var(--ink-2);font-size:14px}
.tag.mine{background:var(--act);color:var(--on-act)}
.tray{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--sunken);border-radius:14px;padding:10px;margin-top:6px}
.cal{flex-basis:100%;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.cal .label{flex-basis:100%;margin-top:3px}
.mini{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;padding-top:3px}
.mini .link{text-decoration-color:var(--act);text-decoration-thickness:3px}
.note{margin:0;font-size:13.5px;font-weight:700;background:var(--soon-soft);color:var(--soon);border-radius:10px;padding:6px 10px}
.note.ok{background:var(--live-soft);color:var(--live)}
.favs,.plan{display:flex;flex-direction:column;gap:14px}
.sec{margin:6px 0 -6px;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2}
.week{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.week li{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:4px 10px;padding:8px 0;border-top:2px dashed var(--sunken);align-items:baseline}
.week .dow{font-family:var(--display);font-size:15.5px;font-weight:700;white-space:nowrap}
.slot{font-family:var(--display)}
.plan-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.plan-top .big{margin:0 auto 0 0;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25}
.toast{position:fixed;left:50%;bottom:max(16px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%) rotate(-1deg);z-index:5;width:max-content;max-width:calc(100vw - 32px);
  background:var(--ink);color:var(--bg);border:2px solid var(--edge);border-radius:18px;padding:9px 16px;font-size:14.5px;font-weight:800;display:flex;gap:14px;align-items:center;box-shadow:3px 3px 0 var(--act)}
.toast button{background:none;border:none;padding:0;color:inherit;font-weight:800;white-space:nowrap;text-decoration-line:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tip{background:var(--surface);border:2px dashed var(--edge);border-radius:16px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font-size:14px}
.tip p{margin:0;flex:1 1 220px}
.tip strong{font-family:var(--display);font-size:15.5px}
.foot{color:var(--ink-2);font-size:13px;max-width:65ch;display:flex;flex-direction:column;gap:6px}
.foot p{margin:0}
@media (prefers-reduced-motion:reduce){
  .mascot,.tag.live::before{animation:none}
  .chip,.day,.tab,.heart,.row-btn{transition:none}
}
@media (max-width:520px){
  .page{gap:15px;padding-block:12px 40px}
  .filters{gap:11px}
  .mast h1{font-size:27px}
  .tag-line{font-size:14.5px}
  .mascot{width:99px}
  .origin-btn{padding:8px 12px}
  .cats .chip{font-size:15.5px;padding:5px 11px 4px}
  .chip{font-size:13.5px;padding:4px 11px}
  .day small{font-size:10px;letter-spacing:0}
  .day span{font-size:19px}
  .opts{gap:11px 18px}
  .who{padding:8px 12px 9px}
  .who-q{font-size:17.5px}
  .age{width:84px;font-size:18px}
  /* phone: time on its own line so the name and tags get the full width */
  .sessions li{grid-template-columns:minmax(0,1fr) auto}
  .sessions .time{grid-column:1;grid-row:1}
  .sessions .what{grid-column:1;grid-row:2}
  .sessions .row-btn{grid-column:2;grid-row:1/span 2}
  .sessions .tray,.sessions .mini{grid-row:3}
  .time{font-size:14.5px}
  .tab{font-size:15.5px;padding:6px 8px 4px}
  .sec{font-size:18.5px}
}
</style>

          fill="var(--fur)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/>

        <path d="M55.5 62 Q60 36 64.5 62 Z" fill="var(--fur-dark)"/>
        <path d="M60 62 C53 54 38 51 25 57 C18 60 15 68 18 75 C29 81 45 79 54 71 Q60 67 66 71 C75 79 91 81 102 75 C105 68 102 60 95 57 C82 51 67 54 60 62 Z" fill="var(--fur-dark)"/>

<script>
(function(){
'use strict';
var LS_KEY='tdf.v1';
var CITY_HALL={label:'City Hall',lat:43.6534,lng:-79.3841,isDefault:true};
var RADII=[2,5,10,0];
var D=null, byDay=new Map(), catTypes=[], lastDay=0;
var P=null, placesPromise=null, curSugs=[];
// favP: favourite places. favA: one activity at one place. plan: dated sessions the visitor picked.
// All three are kept by stable names and ids, never by position in the data, because the data is rebuilt twice a week.
var S={cat:0,types:[],day:0,radius:5,age:null,acc:false,sort:'near',showPast:false,moreTypes:false,limit:30,origin:CITY_HALL,recents:[],
  view:'find',favP:[],favA:[],plan:[],open:null,expand:{},noTip:false};
var SAVED=['cat','types','radius','age','acc','sort','origin','recents','favP','favA','plan','noTip'];
var SESS=new Map(), locByKey=new Map();
// Inside a Claude artifact a page cannot hand over a calendar file, so only the Google link is offered there.
var CAN_FILE=!(window.claude&&typeof window.claude.use==='function');
var NS='http://www.w3.org/2000/svg';
var ICONS={heart:'M12 20.5C5.5 15.6 3 12.2 3 8.7 3 6 5.1 4 7.6 4c1.8 0 3.4 1 4.4 2.6C13 5 14.6 4 16.4 4 18.9 4 21 6 21 8.7c0 3.5-2.5 6.9-9 11.8z',
  plus:'M12 5v14M5 12h14',check:'M5 12.5l5 5L19.5 7',cal:'M4 7h16v13H4zM4 11.5h16M8.5 4v5M15.5 4v5',x:'M6 6l12 12M18 6L6 18'};

function $(s){return document.querySelector(s);}
function h(tag,props){
  var e=document.createElement(tag),k,v,i;
  if(props) for(k in props){
    v=props[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='style') e.style.cssText=v;
    else if(k==='disabled') e.disabled=true;
    else e.setAttribute(k,v===true?'':String(v));
  }
  for(i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}
function add(e,kid){
  if(kid==null||kid===false) return;
  if(Array.isArray(kid)){kid.forEach(function(x){add(e,x);});return;}
  e.appendChild(kid.nodeType?kid:document.createTextNode(String(kid)));
}
function icon(name,solid){
  var s=document.createElementNS(NS,'svg'), p=document.createElementNS(NS,'path');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','ic'+(solid?' solid':'')); s.setAttribute('aria-hidden','true');
  p.setAttribute('d',ICONS[name]); s.appendChild(p); return s;
}

/* ---------- state ---------- */
function loadState(){
  try{
    var j=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(j&&typeof j==='object') SAVED.forEach(function(k){ if(k in j) S[k]=j[k]; });
  }catch(e){}
}
function saveState(){
  var o={}; SAVED.forEach(function(k){ o[k]=S[k]; });
  try{ localStorage.setItem(LS_KEY,JSON.stringify(o)); }catch(e){}
}
function validPoint(o){ return o&&typeof o.label==='string'&&isFinite(o.lat)&&isFinite(o.lng); }
function list(v){ return Array.isArray(v)?v:[]; }
function str(v){ return typeof v==='string'&&v.length>0&&v.length<300; }
function validateSaved(today){
  var seen={}, once=function(k){ if(seen[k]) return false; seen[k]=1; return true; };
  var name=function(f){ var i=locByKey.get(f.k); if(i!=null) f.n=D.locs[i][1]; return f; };
  S.favP=list(S.favP).filter(function(f){ return f&&str(f.k)&&str(f.n)&&once('p'+f.k); }).slice(0,60)
    .map(function(f){ return name({k:f.k,n:f.n}); });
  S.favA=list(S.favA).filter(function(f){ return f&&str(f.k)&&str(f.n)&&str(f.t)&&once('a'+f.k+'|'+f.t); }).slice(0,60)
    .map(function(f){ return name({k:f.k,n:f.n,t:f.t}); });
  // a plan is for what is coming up: days that have passed drop off
  S.plan=list(S.plan).filter(function(p){
    return p&&typeof p.d==='string'&&/^\d{4}-\d\d-\d\d$/.test(p.d)&&dayNum(p.d)>=today&&str(p.k)&&str(p.n)&&str(p.t)
      &&p.s>=0&&p.s<1440&&p.e>p.s&&p.e<=2880&&once('s'+evKey(p));
  }).slice(0,200).map(function(p){
    return {d:p.d,k:p.k,n:p.n,a:str(p.a)?p.a:'',t:p.t,s:Math.round(p.s),e:Math.round(p.e),g:str(p.g)?p.g:''};
  });
}
function validate(){
  if(!(S.cat>=0&&S.cat<D.cats.length)) S.cat=0;
  if(!Array.isArray(S.types)) S.types=[];
  S.types=S.types.filter(function(t){return catTypes[S.cat].indexOf(t)>=0;});
  if(RADII.indexOf(S.radius)<0) S.radius=5;
  if(S.sort!=='near'&&S.sort!=='soon') S.sort='near';
  if(!(typeof S.age==='number'&&S.age>=0&&S.age<=110)) S.age=null;
  S.acc=S.acc===true; S.noTip=S.noTip===true;
  if(!validPoint(S.origin)) S.origin=CITY_HALL;
  if(!Array.isArray(S.recents)) S.recents=[];
  S.recents=S.recents.filter(validPoint).slice(0,5);
  validateSaved(dayNum(torontoNow().date));
}

/* ---------- time ---------- */
function torontoNow(){
  var f=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  var p={}; f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  return {date:p.year+'-'+p.month+'-'+p.day, mins:(+p.hour%24)*60+(+p.minute)};
}
function dayNum(iso){ var a=iso.split('-').map(Number); return Math.round(Date.UTC(a[0],a[1]-1,a[2])/864e5); }
function dateOf(n){ return new Date(n*864e5); }
function fmtDate(n,opts){ opts.timeZone='UTC'; return dateOf(n).toLocaleDateString('en-CA',opts); }
function clock(m){ var hh=Math.floor(m/60)%24, mm=m%60; return {t:(hh%12||12)+':'+(mm<10?'0':'')+mm, ap:hh<12?'am':'pm'}; }
function span(a,b){ var x=clock(a), y=clock(b); return x.ap===y.ap ? x.t+'–'+y.t+' '+y.ap : x.t+' '+x.ap+'–'+y.t+' '+y.ap; }
function at(m){ var x=clock(m); return x.t+' '+x.ap; }
function isoOf(n){ return dateOf(n).toISOString().slice(0,10); }
function dow(n){ return fmtDate(n,{weekday:'short'}).replace('.',''); }

/* ---------- distance ---------- */
function km(a,b,c,d){
  var r=Math.PI/180, x=Math.sin((c-a)*r/2), y=Math.sin((d-b)*r/2);
  return 12742*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y));
}
function fmtKm(v){ return (v<10?v.toFixed(1):Math.round(v))+' km'; }
function ageLabel(a,b){
  if(a==null&&b==null) return 'All ages';
  if(b==null) return 'Ages '+a+'+';
  if(a==null) return 'Up to age '+b;
  return 'Ages '+a+'–'+b;
}

/* ---------- data ---------- */
function index(){
  byDay=new Map();
  var tc=D.cats.map(function(){return new Map();});
  D.rows.forEach(function(r){
    var c=D.courses[r[1]], m=tc[c[1]];
    m.set(c[2],(m.get(c[2])||0)+r[6].length);
    r[6].forEach(function(d){ var a=byDay.get(d); if(!a){a=[];byDay.set(d,a);} a.push(r); });
  });
  catTypes=tc.map(function(m){ return Array.from(m.entries()).sort(function(a,b){return b[1]-a[1];}).map(function(x){return x[0];}); });
  lastDay=0; byDay.forEach(function(_,k){ if(k>lastDay) lastDay=k; });
  locByKey=new Map();
  D.locs.forEach(function(L,i){ var k=locKey(L); if(!locByKey.has(k)) locByKey.set(k,i); });
}

/* ---------- favourites and plan ---------- */
// EarlyON centres (10 fields) and recreation centres (8) are numbered separately by the city, so the key says which list.
function locKey(L){ return (L.length>8?'e':'r')+L[0]; }
function evOf(iso,L,c,r){ return {d:iso,k:locKey(L),n:L[1],a:L[4]||'',t:c[0],s:r[2],e:r[3],g:c[4]||ageLabel(r[4],r[5])}; }
function evKey(p){ return [p.d,p.k,p.t,p.s,p.e].join('|'); }
function planAt(key){ for(var i=0;i<S.plan.length;i++) if(evKey(S.plan[i])===key) return i; return -1; }
function favPAt(k){ for(var i=0;i<S.favP.length;i++) if(S.favP[i].k===k) return i; return -1; }
function favAAt(k,t){ for(var i=0;i<S.favA.length;i++) if(S.favA[i].k===k&&S.favA[i].t===t) return i; return -1; }
function where(p){ return [p.n,p.a,'Toronto, ON'].filter(Boolean).join(', '); }
function mapsUrl(p){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(where(p)); }

/* ---------- calendar ---------- */
var TZF=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function wallClock(ms){
  var p={}; TZF.formatToParts(new Date(ms)).forEach(function(x){p[x.type]=x.value;});
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute);
}
// A Toronto date and time of day as a UTC stamp, right in both winter and summer time.
function utcStamp(dn,mins){
  var wall=dn*864e5+mins*6e4, guess=wall+5*36e5, utc=guess-(wallClock(guess)-wall);
  return new Date(utc).toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
}
function evNote(p){
  return 'Drop-in at '+p.n+(p.g?' ('+p.g+')':'')+'. From the City of Toronto’s posted schedule, which can change. Check with the centre before you go.';
}
function gcal(p){
  var dn=dayNum(p.d), q=encodeURIComponent;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+q(p.t)+'&dates='+utcStamp(dn,p.s)+'/'+utcStamp(dn,p.e)
    +'&location='+q(where(p))+'&details='+q(evNote(p));
}
function icsText(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function fold(line){   // calendar files allow 75 bytes a line; longer ones continue on the next, after a space
  var out='', cur='', n=0;
  Array.from(line).forEach(function(ch){
    var c=ch.codePointAt(0), len=c<0x80?1:c<0x800?2:c<0x10000?3:4;
    if(n+len>73){ out+=cur+'\r\n '; cur=''; n=1; }
    cur+=ch; n+=len;
  });
  return out+cur;
}
function uid(p){
  var s=evKey(p), hsh=5381, i;
  for(i=0;i<s.length;i++) hsh=((hsh*33)^s.charCodeAt(i))>>>0;
  return 'tdf-'+p.d.replace(/-/g,'')+'-'+p.s+'-'+hsh.toString(36)+'@toronto-drop-in-finder';
}
function icsFile(evs){
  var stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  var out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Toronto Drop-In Finder//EN','CALSCALE:GREGORIAN'];
  evs.forEach(function(p){
    var dn=dayNum(p.d);
    out.push('BEGIN:VEVENT','UID:'+uid(p),'DTSTAMP:'+stamp,'DTSTART:'+utcStamp(dn,p.s),'DTEND:'+utcStamp(dn,p.e),
      'SUMMARY:'+icsText(p.t),'LOCATION:'+icsText(where(p)),'DESCRIPTION:'+icsText(evNote(p)),'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.map(fold).join('\r\n')+'\r\n';
}
function saveIcs(name,evs){
  if(!evs.length) return;
  var a=h('a',{href:'data:text/calendar;charset=utf-8,'+encodeURIComponent(icsFile(evs)),download:name,style:'display:none'});
  document.body.appendChild(a); a.click();
  setTimeout(function(){ a.remove(); },2000);
}
function calBtns(p,key){
  return h('span',{class:'cal'},h('span',{class:'label',text:'Add to calendar'}),
    CAN_FILE?h('button',{class:'chip',type:'button','data-do':'ics','data-key':key,text:'Apple or Outlook'}):null,
    h('a',{class:'chip',href:gcal(p),target:'_blank',rel:'noopener',text:'Google'}));
}

/* ---------- toast ---------- */
var toastTimer=null, toastFn=null;
function toast(msg,label,fn){
  var t=$('#toast'); t.textContent=''; add(t,h('span',{text:msg}));
  toastFn=label&&fn?fn:null;
  if(toastFn) add(t,h('button',{type:'button',text:label}));
  t.hidden=false; clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.hidden=true; toastFn=null; },toastFn?6500:3200);
}

/* ---------- filters ---------- */
function chip(text,pressed,attrs){
  var p={class:'chip',type:'button','aria-pressed':pressed?'true':'false',text:text},k;
  for(k in attrs) p[k]=attrs[k];
  return h('button',p);
}
var MOODS=['swim','skate','sports','fit','arts','youth','early'];
var VERBS={'Swim':'swim','Skate':'skate','Sports':'play','Fitness':'sweat','Arts & Hobbies':'make stuff','Youth Spaces':'hang out','Early Years':'play with my kid'};
function renderMood(){
  $('.page').setAttribute('data-mood',S.cat);
  var p=$('#tagline'); p.textContent='';
  if(S.view==='favs') add(p,['My ',h('mark',{text:'favourite'}),' places to just show up']);
  else if(S.view==='plan') add(p,['Where I’m ',h('mark',{text:'showing up'}),' this week']);
  else add(p,['Where can I just show up and ',h('mark',{text:VERBS[D.cats[S.cat]]||D.cats[S.cat].toLowerCase()}),'?']);
}
function renderTabs(){
  var box=$('#tabs'); box.textContent='';
  [['find','Find',0],['favs','Favourites',S.favP.length+S.favA.length],['plan','My plan',S.plan.length]].forEach(function(t){
    add(box,h('button',{class:'tab',type:'button','data-view':t[0],'aria-pressed':S.view===t[0]?'true':'false'},
      t[1],t[2]?h('span',{class:'count',text:t[2]}):null));
  });
}
function renderOrigin(){
  $('#origin-label').textContent=S.origin.label;
}
function renderCats(){
  var box=$('#cats'); box.textContent='';
  D.cats.forEach(function(c,i){ box.appendChild(chip(c,i===S.cat,{'data-cat':i,style:'--c:var(--'+(MOODS[i]||'swim')+')'})); });
}
function renderTypes(){
  var box=$('#types'); box.textContent='';
  var all=catTypes[S.cat], shown=all.slice(0,8);
  S.types.forEach(function(t){ if(shown.indexOf(t)<0) shown.push(t); });
  if(S.moreTypes) shown=all;
  box.appendChild(chip('All',S.types.length===0,{'data-all':1}));
  shown.forEach(function(t){ box.appendChild(chip(t,S.types.indexOf(t)>=0,{'data-type':t})); });
  if(all.length>shown.length||S.moreTypes&&all.length>8)
    box.appendChild(h('button',{class:'chip quiet',type:'button','data-more':1,text:S.moreTypes?'Fewer':'+'+(all.length-shown.length)+' more'}));
}
function renderDays(now,box){
  box=box||$('#days'); box.textContent='';
  var t0=dayNum(now.date), base=t0-dayNum(D.start), i;
  for(i=0;i<7;i++){
    box.appendChild(h('button',{class:'day',type:'button','data-day':i,'aria-pressed':i===S.day?'true':'false',disabled:base+i>lastDay||base+i<0,
      'aria-label':fmtDate(t0+i,{weekday:'long',month:'long',day:'numeric'})},
      h('small',{text:i===0?'Today':dow(t0+i)}),
      h('span',{text:dateOf(t0+i).getUTCDate()})));
  }
}
function renderOpts(){
  var r=$('#radius'), s=$('#sort'); r.textContent=''; s.textContent='';
  RADII.forEach(function(v){ r.appendChild(chip(v?v+' km':'Any',S.radius===v,{'data-r':v})); });
  s.appendChild(chip('Nearest',S.sort==='near',{'data-s':'near'}));
  s.appendChild(chip('Soonest',S.sort==='soon',{'data-s':'soon'}));
  var x=$('#access'); x.textContent='';
  x.appendChild(chip('Fully accessible only',S.acc,{'data-acc':1}));
  var a=$('#age'), hint=$('#age-hint'); if(document.activeElement!==a) a.value=S.age==null?'':S.age;

  var box=$('#tip'); box.textContent=''; box.hidden=true;
  if(!CAN_FILE||S.noTip||S.view!=='find'||standalone()) return;
  var ua=navigator.userAgent||'', ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), how;
  if(installEvt) how='';
  else if(/Android/.test(ua)) how='Open your browser’s menu, then tap “Add to Home screen” or “Install app”. ';
  else if(ios) how='Tap the Share button, then “Add to Home Screen”. ';
  else return;
  box.hidden=false;
  add(box,h('p',null,h('strong',{text:'Keep this on your home screen. '}),how+'It opens like an app, even with no signal.'));
  add(box,h('div',{class:'row'},
    installEvt?h('button',{class:'chip',type:'button','data-tip':'install',text:'Add to home screen'}):null,
    h('button',{class:'chip quiet',type:'button','data-tip':'hide',text:installEvt?'Not now':'Got it'})));
}
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; if(D) renderTip(); });
window.addEventListener('appinstalled',function(){ installEvt=null; if(D) renderTip(); });
function renderFoot(){
  var f=$('#foot'); f.textContent='';
  var d=function(iso){return fmtDate(dayNum(iso),{month:'short',day:'numeric'});};
  add(f,h('p',{text:'Schedules come from the City of Toronto open data feed published '+d(D.sourceUpdated||D.start)+' and run to '+d(D.end)+'. The city updates the feed weekly, so a same-day closure or cancellation will not appear here. Check the centre’s city page before you head out.'}));
  if(D.earlyonUpdated) add(f,h('p',{text:'EarlyON centres are free and for children from birth to 6 with a parent or caregiver. The city’s EarlyON list, updated '+d(D.earlyonUpdated)+', gives each centre’s regular weekly drop-in hours but not what runs in each time slot. Where a card has a green note, the session names and ages were read by hand from that agency’s own calendar on the date shown, and replace the city’s hours for the days that calendar covers. Everywhere else, ask the centre about baby-only or toddler times. Centres can close for holidays and school breaks, so check first.'}));
  add(f,h('p',{text:'Favourites and your plan are saved in this browser only. They will not show up on another phone or computer.'}));
  add(f,h('p',{text:'Distances are straight-line. Postal code searches use the approximate middle of the area.'}));
  add(f,h('p',{text:'An unofficial personal tool, not a City of Toronto service. Contains information licensed under the Open Government Licence – Toronto.'}));
}
function render(){
  if(!D) return;
  var now=torontoNow(), v=S.view;
  SESS=new Map();
  renderMood(); renderTabs(); renderOrigin(); renderTip();
  $('.origin').hidden=v==='plan';
  $('.filters').hidden=$('#summary').hidden=$('#results').hidden=v!=='find';
  $('#favs').hidden=v!=='favs'; $('#plan').hidden=v!=='plan';
  if(v==='find'){ renderCats(); renderTypes(); renderDays(now); renderOpts(); renderNotice(now); renderResults(now); }
  else{ $('#notice').hidden=true; if(v==='favs') renderFavs(now); else renderPlan(now); }
}

/* ---------- favourite and plan actions ---------- */
function setView(v){
  S.view=v; S.open=null; render();
  var t=$('#tabs'); if(t.getBoundingClientRect().top<0) t.scrollIntoView({block:'start'});
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'drop-in'; }
function undo(key,prev){ return function(){ S[key]=prev; saveState(); render(); }; }
function goTo(v){ return function(){ setView(v); }; }
function toggleFavP(k){
  var i=favPAt(k), li=locByKey.get(k), prev=S.favP.slice();
  if(i>=0){ var n=S.favP.splice(i,1)[0].n; toast(n+' removed from Favourites','Undo',undo('favP',prev)); }
  else if(li!=null){ S.favP.push({k:k,n:D.locs[li][1]}); toast(D.locs[li][1]+' added to Favourites',S.view==='favs'?null:'View',goTo('favs')); }
  else return;
  saveState(); render();
}
function act(what,t){
  var key=t.getAttribute('data-key'), ev=key?SESS.get(key):null, i, prev;
  if(what==='plan'&&ev){
    i=planAt(key); prev=S.plan.slice();
    if(i>=0){ S.plan.splice(i,1); toast('Removed from your plan','Undo',undo('plan',prev)); }
    else{ S.plan.push(ev); toast('Added to your plan','View',goTo('plan')); }
  }else if(what==='unplan'){
    i=planAt(key); if(i<0) return;
    prev=S.plan.slice(); S.plan.splice(i,1); toast('Removed from your plan','Undo',undo('plan',prev));
  }else if(what==='fava'&&ev){
    i=favAAt(ev.k,ev.t); prev=S.favA.slice();
    if(i>=0){ S.favA.splice(i,1); toast(ev.t+' here removed from Favourites','Undo',undo('favA',prev)); }
    else{ S.favA.push({k:ev.k,n:ev.n,t:ev.t}); toast(ev.t+' at '+ev.n+' added to Favourites','View',goTo('favs')); }
  }else if(what==='unfava'){
    i=+t.getAttribute('data-i'); if(!S.favA[i]) return;
    prev=S.favA.slice(); toast(S.favA.splice(i,1)[0].t+' removed from Favourites','Undo',undo('favA',prev));
  }else if(what==='clearplan'){
    prev=S.plan.slice(); S.plan=[]; toast('Plan cleared','Undo',undo('plan',prev));
  }else if(what==='ics'&&ev){ saveIcs(slug(ev.t)+'-'+ev.d+'.ics',[ev]); return; }
  else if(what==='icsall'){ saveIcs('toronto-drop-ins.ics',S.plan.slice().sort(byWhen)); return; }
  else if(what==='expand'){ S.expand[key]=true; render(); return; }
  else return;
  saveState(); render();
}

/* ---------- starting point ---------- */
var ABBR={street:'st',saint:'st',avenue:'ave',av:'ave',road:'rd',drive:'dr',crescent:'cres',court:'crt',ct:'crt',place:'pl',boulevard:'blvd',
  gate:'gt',square:'sq',terrace:'ter',terr:'ter',gardens:'gdns',trail:'trl',circle:'crcl',cir:'crcl',grove:'grv',heights:'hts',pathway:'ptwy',
  park:'pk',parkway:'pkwy',circuit:'crct',west:'w',east:'e',north:'n',south:'s'};
var LONG={}; Object.keys(ABBR).forEach(function(k){ (LONG[ABBR[k]]=LONG[ABBR[k]]||[]).push(k); });
function tokens(s){ return s.toLowerCase().replace(/[.,'’]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean); }
function matchAt(qt,kt,off){
  if(off+qt.length>kt.length) return false;
  for(var i=0;i<qt.length;i++){
    var q=qt[i], k=kt[off+i];
    if(k===q||k===ABBR[q]) continue;
    if(i===qt.length-1&&(k.indexOf(q)===0||(LONG[k]&&LONG[k].some(function(l){return l.indexOf(q)===0;})))) continue;
    return false;
  }
  return true;
}
function ensurePlaces(){
  if(!placesPromise) placesPromise=fetch('data/places.json').then(function(r){ if(!r.ok) throw new Error('places '+r.status); return r.json(); }).then(function(j){
    j.stTok=j.streets.map(function(s){return tokens(s[0]);});
    j.plTok=j.places.map(function(p){return tokens(p[0]);});
    P=j; return j;
  });
  return placesPromise;
}
function locate(street,num){
  var d=street[2], n=0, la=0, lo=0, pts=[], i;
  for(i=0;i<d.length;i+=3){ n+=d[i]; la+=d[i+1]; lo+=d[i+2]; pts.push([n,la/P.scale,lo/P.scale]); }
  var side=pts.filter(function(p){return (p[0]-num)%2===0;}); if(!side.length) side=pts;
  var a=null, b=null;
  for(i=0;i<side.length;i++){ if(side[i][0]<=num) a=side[i]; if(side[i][0]>=num){ b=side[i]; break; } }
  if(a&&b&&a!==b&&b[0]!==a[0]){
    var t=(num-a[0])/(b[0]-a[0]);
    if(km(a[1],a[2],b[1],b[2])>1.5) return t<0.5?a:b;   // a gap in the street: snap, don't guess the middle
    return [num,a[1]+t*(b[1]-a[1]),a[2]+t*(b[2]-a[2])];
  }
  return a||b;
}
function suggest(text){
  var out=[], raw=text.trim(), hint='';
  if(raw.length<2) return {list:out,hint:hint};
  var pc=raw.toUpperCase().replace(/\s+/g,'').match(/^(M\d[A-Z])(\d[A-Z]\d)?$/);
  if(pc){
    var f=P.fsa.filter(function(x){return x[0]===pc[1];})[0];
    if(f) out.push({label:pc[1]+' postal area',sub:'Approximate middle of the area',lat:f[1],lng:f[2]});
    else hint='No match for that postal code. Try a street address.';
    return {list:out,hint:hint};
  }
  var m=raw.match(/^(\d+)\s*[a-z]?\s+(.+)$/i), qt=tokens(m?m[2]:raw);
  if(!qt.length) return {list:out,hint:hint};
  var hits=[], i, off;
  for(i=0;i<P.stTok.length;i++){
    for(off=0;off<P.stTok[i].length;off++){
      if(matchAt(qt,P.stTok[i],off)){ hits.push({i:i,rank:off*10+(P.stTok[i].length-qt.length)}); break; }
    }
  }
  hits.sort(function(a,b){return a.rank-b.rank||P.streets[b.i][2].length-P.streets[a.i][2].length||(P.streets[a.i][0]<P.streets[b.i][0]?-1:1);});
  if(m){
    hits.slice(0,6).forEach(function(x){
      var s=P.streets[x.i], p=locate(s,+m[1]);
      if(p) out.push({label:m[1]+' '+s[0],sub:s[1]>=0?P.munis[s[1]]:'Street address',lat:p[1],lng:p[2]});
    });
  }else if(hits.length){
    hint='For a street address, start with the number, like 500 '+P.streets[hits[0].i][0]+'.';
  }
  var kinds={n:'Neighbourhood',c:'Community centre',p:'Park'}, order={n:0,c:1,p:2}, ph=[];
  var pq=tokens(raw);
  for(i=0;i<P.plTok.length;i++){
    var kt=P.plTok[i];
    if(pq.every(function(q){return kt.some(function(k){return k.indexOf(q)===0;});}))
      ph.push({i:i,rank:(kt[0].indexOf(pq[0])===0?0:10)+order[P.places[i][3]]+kt.length/100});
  }
  ph.sort(function(a,b){return a.rank-b.rank;});
  ph.slice(0,m?2:6).forEach(function(x){ var p=P.places[x.i]; out.push({label:p[0],sub:kinds[p[3]]||'',lat:p[1],lng:p[2]}); });
  if(!out.length&&!hint) hint='No match in Toronto. Try a street number and name, like 500 Danforth Ave.';
  return {list:out,hint:hint};
}
function renderSugs(){
  var ul=$('#sugs'), hint=$('#loc-hint'), text=$('#loc-input').value;
  ul.textContent=''; hint.hidden=true; curSugs=[];
  if(text.trim().length<2) return;
  if(!P){
    hint.hidden=false; hint.textContent='Loading Toronto addresses…';
    ensurePlaces().then(renderSugs,function(){ hint.hidden=false; hint.textContent='The address list did not load. Reload the page to try again.'; });
    return;
  }
  var res=suggest(text); curSugs=res.list;
  res.list.forEach(function(s,i){
    ul.appendChild(h('li',null,h('button',{type:'button','data-i':i},h('span',{class:'s-main',text:s.label}),h('span',{class:'s-sub',text:s.sub}))));
  });
  if(res.hint){ hint.hidden=false; hint.textContent=res.hint; }
}
function renderRecents(){
  var box=$('#recents'); box.textContent=''; box.hidden=!S.recents.length;
  if(!S.recents.length) return;
  add(box,h('span',{class:'label',text:'Recent'}));
  S.recents.forEach(function(r,i){ add(box,chip(r.label,false,{'data-recent':i})); });
  add(box,h('button',{class:'link',type:'button','data-clear':1,text:'Clear'}));
}
function setOrigin(o,remember){
  S.origin={label:o.label,lat:o.lat,lng:o.lng};
  if(o.live) S.origin.live=true;
  if(remember){
    S.recents=[S.origin].concat(S.recents.filter(function(r){return r.label!==o.label;})).slice(0,5);
  }
  S.limit=30; saveState(); togglePanel(false); render();
}
function togglePanel(open){
  var p=$('#loc-panel'), b=$('#origin-btn');
  p.hidden=!open; b.setAttribute('aria-expanded',open?'true':'false');
  $('#origin-change').textContent=open?'Close':'Change';
  if(open){
    ensurePlaces().catch(function(){});
    renderRecents(); $('#loc-input').value=''; renderSugs();
    try{ $('#loc-input').focus({preventScroll:true}); }catch(e){}
  }
}
function geoAllowed(){
  if(!('geolocation' in navigator)) return Promise.resolve(false);
  try{ var pp=document.permissionsPolicy||document.featurePolicy; if(pp&&pp.allowsFeature&&!pp.allowsFeature('geolocation')) return Promise.resolve(false); }catch(e){}
  if(!navigator.permissions||!navigator.permissions.query) return Promise.resolve(true);
  return navigator.permissions.query({name:'geolocation'}).then(function(s){return s.state!=='denied';},function(){return true;});
}
function useGeo(silent){
  var hint=$('#loc-hint');
  if(!silent){ hint.hidden=false; hint.textContent='Finding you…'; }
  navigator.geolocation.getCurrentPosition(function(pos){
    setOrigin({label:'My current location',lat:pos.coords.latitude,lng:pos.coords.longitude,live:true},false);
  },function(){
    if(silent) return;
    hint.hidden=false; hint.textContent='Your location is not available here. Type an address instead.';
    $('#geo-btn').hidden=true;
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

/* ---------- events ---------- */
function on(sel,type,fn){ $(sel).addEventListener(type,fn); }
function hit(e,attr){ var t=e.target.closest('['+attr+']'); return t&&!t.disabled?t:null; }
function changed(){ S.limit=30; saveState(); render(); }
on('#origin-btn','click',function(){ togglePanel($('#loc-panel').hidden); });
on('#loc-input','input',renderSugs);
on('#loc-input','keydown',function(e){ if(e.key==='Enter'&&curSugs.length){ e.preventDefault(); setOrigin(curSugs[0],true); } });
on('#sugs','click',function(e){ var t=hit(e,'data-i'); if(t) setOrigin(curSugs[+t.getAttribute('data-i')],true); });
on('#geo-btn','click',function(){ useGeo(false); });
on('#recents','click',function(e){
  var t=hit(e,'data-recent');
  if(t){ setOrigin(S.recents[+t.getAttribute('data-recent')],true); return; }
  if(hit(e,'data-clear')){ S.recents=[]; saveState(); renderRecents(); }
});
on('#cats','click',function(e){ var t=hit(e,'data-cat'); if(!t) return; S.cat=+t.getAttribute('data-cat'); S.types=[]; S.moreTypes=false; changed(); });
on('#types','click',function(e){
  var t;
  if(hit(e,'data-all')){ S.types=[]; changed(); return; }
  if(hit(e,'data-more')){ S.moreTypes=!S.moreTypes; render(); return; }
  if((t=hit(e,'data-type'))){
    var v=t.getAttribute('data-type'), i=S.types.indexOf(v);
    if(i>=0) S.types.splice(i,1); else S.types.push(v);
    changed();
  }
});
on('#days','click',function(e){ var t=hit(e,'data-day'); if(!t) return; S.day=+t.getAttribute('data-day'); S.showPast=false; changed(); });
on('#radius','click',function(e){ var t=hit(e,'data-r'); if(!t) return; S.radius=+t.getAttribute('data-r'); changed(); });
on('#sort','click',function(e){ var t=hit(e,'data-s'); if(!t) return; S.sort=t.getAttribute('data-s'); changed(); });
on('#age','input',function(){ var v=$('#age').value.trim(), n=parseInt(v,10); S.age=v!==''&&n>=0&&n<=110?n:null; changed(); });
on('#who','click',function(e){ if(hit(e,'data-act')){ S.age=null; $('#age').value=''; changed(); } });
on('#tip','click',function(e){
  var t=hit(e,'data-tip'); if(!t) return;
  if(t.getAttribute('data-tip')==='install'&&installEvt){ var ev=installEvt; installEvt=null; ev.prompt(); renderTip(); return; }
  S.noTip=true; saveState(); renderTip();
});
on('#access','click',function(e){ if(hit(e,'data-acc')){ S.acc=!S.acc; changed(); } });
on('#summary','click',function(e){ if(hit(e,'data-act')){ S.showPast=!S.showPast; render(); } });
on('#notice','click',function(e){ if(hit(e,'data-act')){ togglePanel(true); $('#origin-btn').scrollIntoView({block:'start'}); } });
on('#results','click',function(e){
  var t=hit(e,'data-act'); if(!t) return;
  var a=t.getAttribute('data-act');
  if(a==='radius'){ S.radius=+t.getAttribute('data-v'); changed(); }
  else if(a==='more'){ S.limit+=30; render(); }
});
// tabs, hearts, the round + beside a time, and everything inside its tray
document.addEventListener('click',function(e){
  var t, k, b;
  if(!D) return;
  if(e.target.closest('#toast')){
    if(e.target.closest('button')&&toastFn){ t=toastFn; toastFn=null; $('#toast').hidden=true; t(); }
    return;
  }
  if((t=hit(e,'data-view'))){ setView(t.getAttribute('data-view')); return; }
  if((t=hit(e,'data-favp'))){ toggleFavP(t.getAttribute('data-favp')); return; }
  if((t=hit(e,'data-row'))){
    k=t.getAttribute('data-row'); S.open=S.open===k?null:k; render();
    b=Array.prototype.filter.call(document.querySelectorAll('[data-row]'),function(x){ return x.getAttribute('data-row')===k&&x.offsetParent; })[0];
    if(b) try{ b.focus({preventScroll:true}); }catch(err){}
    return;
  }
  if((t=hit(e,'data-do'))){ act(t.getAttribute('data-do'),t); return; }
  if((t=hit(e,'data-day'))&&t.closest('#favs')){ S.day=+t.getAttribute('data-day'); S.showPast=false; changed(); }
});

/* ---------- start ---------- */
loadState();
fetch('data/schedule.json').then(function(r){ if(!r.ok) throw new Error('schedule '+r.status); return r.json(); }).then(function(j){
  D=j; index(); validate(); renderFoot(); render();
  setInterval(function(){ if(!document.hidden&&(S.day===0||S.view!=='find')) render(); },60000);
  geoAllowed().then(function(ok){
    $('#geo-btn').hidden=!ok;
    if(ok&&S.origin.live&&navigator.permissions&&navigator.permissions.query)
      navigator.permissions.query({name:'geolocation'}).then(function(s){ if(s.state==='granted') useGeo(true); },function(){});
  });
}).catch(function(){
  $('#summary').textContent='';
  add($('#summary'),h('p',{text:'The schedule did not load. Reload the page to try again.'}));
});
})();
</script>
